<!DOCTYPE html>
<html lang="ar">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الرئيسية</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/styles.css">
</head>

<body dir="rtl" onload="filterByBadge('all') ; loadWeeklyGallery()">
    <header>
        <img src="assets/img/Logo.png" alt="Logo">
        
        <nav>
        <span>الرئيسية</span>
        <a href="/events.html">الفعاليات</a>
        <a href="/about.html">عن فعالياتنا</a>
        <a href="/contact.html">اتصل بنا</a> 
        </nav>
        
    </header>
    <main>
        <!-- badges section -->
         <section class="container py-4 text-center">
            <h2 class="mb-4">فعاليات بارزة هذا الأسبوع</h2>
            <div id="filterBadges">
                <span class="badge rounded-pill bg-primary p-2 px-3 m-1" style="cursor:pointer" onclick="filterByBadge('all')">الكل</span>
                <span class="badge rounded-pill bg-secondary p-2 px-3 m-1" style="cursor:pointer" onclick="filterByBadge('رياضة')">رياضة</span>
                <span class="badge rounded-pill bg-secondary p-2 px-3 m-1" style="cursor:pointer" onclick="filterByBadge('ثقافة')">ثقافة</span>
                <span class="badge rounded-pill bg-secondary p-2 px-3 m-1" style="cursor:pointer" onclick="filterByBadge('تعليمي')">تعليمي</span>
                <span class="badge rounded-pill bg-secondary p-2 px-3 m-1" style="cursor:pointer" onclick="filterByBadge('موسيقى')">موسيقى</span>
            </div>
        </section>

        <!-- weekly events -->
        <section class="container py-5">
            
            <!-- container for the weekly events  -->
            <div id="weeklyEventsList" class="row">
                </div>
        </section>

        <!-- current week events imgs -->
         <section class="container py-5 border-top">
            <h2 class="mb-4 text-center">أحدث الفعاليات</h2>
            <div id="weeklyGallery" class="row g-2">
                </div>
        </section>
    </main>
    <footer>
        <div>
            <h2>تواصل</h2>
            <a href="">إيميل</a>
            <a href="">هاتف</a>
        </div>
        <div>
            <h2>تابعنا</h2>
            <a href=""><img src="assets/img/facebook.png" alt=""></a>
            <a href=""><img src="assets/img/instagram.png" alt=""></a>
        </div>
        <div>
            <p>جيمع الحقوق محفوظة &copy; 2026 فريق فعالياتنا</p>
        </div>
    </footer>

    <script src="assets/js/main.js"></script>
</body>

</html>
