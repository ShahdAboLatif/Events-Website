<!DOCTYPE html>
<html lang="ar">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events</title>

      <!-- bootstrap for css -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
   
    <!-- js main file -->
    <script src="assets/js/main.js"></script>
</head>

<body dir="rtl" onload="displayEvents()">
    <header>
        <img src="assets/img/Logo.png" alt="Logo">
        
        <nav>
        <a href="/index.html">الرئيسية</a>
        <span>الفعاليات</span>
        <a href="/about.html">عن فعالياتنا</a>
        <a href="/contact.html">اتصل بنا</a> 
        </nav>
        
    </header>
    <main>
        <div>
            <!-- filters -->
            <div class="container mt-4">
                <div class="row g-3 align-items-end justify-content-center">
                    <div class="col-md-3">
                        <label for="placeFilter" class="form-label">المنطقة</label>
                        <select class="form-select" id="placeFilter">
                            <option selected value="all">كل المناطق</option>
                            <option value="riyadh">قنوات</option>
                            <option value="jeddah">الرحى</option>
                            <option value="dammam">مركز دبي التجاري</option>
                        </select>
                    </div>

                    <div class="col-md-3">
                        <label for="dateFilter" class="form-label">التاريخ</label>
                        <input type="date" class="form-control" id="dateFilter">
                    </div>

                    <div class="col-md-3">
                        <label for="categoryFilter" class="form-label">التصنيف</label>
                        <select class="form-select" id="categoryFilter">
                            <option selected value="all">كل التصنيفات</option>
                            <option value="ثقافة">ثقافة</option>
                            <option value="رياضة">رياضة</option>
                            <option value="موسيقة">موسيقة</option>
                        </select>
                    </div>

                    <div class="col-md-auto">
                        <button class="btn btn-primary px-4" id="filterBtn" onclick="displayFilteredEvents()">تصفية</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="container py-5">
        <h1 class="text-center mb-4">الفعاليات القادمة</h1>
        
        <div class="row" id="eventsContainer">
            <!-- Events will be added here by JavaScript -->
        </div>
    </div>
    </main>
    <footer>
        <div>
            <h2>تواصل</h2>
            <a href="">إيميل</a>
            <a href="">هاتف</a>
        </div>
        <div>
            <h2>تابعنا</h2>
            <a href=""><img src="assets/img/facebook.png" alt=""></a>
            <a href=""><img src="assets/img/instagram.png" alt=""></a>
        </div>
        <div>
            <p>جيمع الحقوق محفوظة &copy; 2026 فريق فعالياتنا</p>
        </div>
    </footer>

    <!-- bootstrap for JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/main.js"></script>
</body>

</html>
